<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" role="img" aria-label="Ilef BEN HASSEN - Data Scientist and AI Engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#32E0C4" fill-opacity="0.18"/></pattern>
    <radialGradient id="glowA" cx="0.72" cy="0.45" r="0.6"><stop offset="0" stop-color="#32E0C4" stop-opacity="0.28"/><stop offset="1" stop-color="#32E0C4" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.1" r="0.5"><stop offset="0" stop-color="#B48CFF" stop-opacity="0.25"/><stop offset="1" stop-color="#B48CFF" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.55" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32E0C4"/>
      <stop offset="1" stop-color="#B48CFF"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="300" rx="18" fill="#0B1220"/>
  <rect width="900" height="300" rx="18" fill="url(#dots)"/>
  <rect width="900" height="300" rx="18" fill="url(#glowA)"/>
  <rect width="900" height="300" rx="18" fill="url(#glowB)"/>

  <!-- floating background dots -->
  <g fill="#32E0C4" opacity="0.35">
    <circle cx="410" cy="40" r="2"><animate attributeName="cy" values="40;30;40" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="120" r="2"><animate attributeName="cy" values="120;108;120" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="270" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="260" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ═════════ LEFT: TEXT ═════════ -->
  <text x="44" y="96" font-family="'Fira Code','Courier New',monospace" font-size="40" font-weight="700" fill="url(#accent)">Ilef BEN HASSEN
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <rect x="44" y="108" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="320" dur="1.4s" fill="freeze"/>
  </rect>

  <text x="44" y="150" font-family="'Fira Code','Courier New',monospace" font-size="21" fill="#FFFFFF">Data Scientist &amp; AI Engineer
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.6s" fill="freeze"/>
  </text>
  <text x="44" y="178" font-family="'Fira Code','Courier New',monospace" font-size="14" fill="#9FB4C0">TEK-UP University · Tunisia
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1s" fill="freeze"/>
  </text>

  <!-- skill chips appearing one after another -->
  <g font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#0F2027" font-weight="700">
    <g opacity="0"><rect x="44" y="204" width="70" height="26" rx="13" fill="#32E0C4"/><text x="79" y="222" text-anchor="middle">Python</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.4s" fill="freeze"/></g>
    <g opacity="0"><rect x="122" y="204" width="60" height="26" rx="13" fill="#B48CFF"/><text x="152" y="222" text-anchor="middle">ML</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="1.8s" fill="freeze"/></g>
    <g opacity="0"><rect x="190" y="204" width="60" height="26" rx="13" fill="#32E0C4"/><text x="220" y="222" text-anchor="middle">RAG</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.2s" fill="freeze"/></g>
    <g opacity="0"><rect x="258" y="204" width="80" height="26" rx="13" fill="#B48CFF"/><text x="298" y="222" text-anchor="middle">MLOps</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.6s" fill="freeze"/></g>
    <g opacity="0"><rect x="346" y="204" width="70" height="26" rx="13" fill="#32E0C4"/><text x="381" y="222" text-anchor="middle">Cloud</text>
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="3s" fill="freeze"/></g>
  </g>

  <!-- code line typing -->
  <text x="44" y="268" font-family="'Fira Code','Courier New',monospace" font-size="13" fill="#32E0C4">&gt;&gt;&gt; model.fit(data) <tspan fill="#B48CFF">#</tspan> insights
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- ═════════ RIGHT: FLOATING PANELS ═════════ -->
  <!-- Bar chart panel -->
  <g transform="translate(440,34)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="4s" repeatCount="indefinite"/>
      <rect width="120" height="84" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#32E0C4" stroke-opacity="0.45"/>
      <line x1="10" y1="70" x2="110" y2="70" stroke="#9FB4C0" stroke-opacity="0.5"/>
      <rect x="16" width="16" rx="2" fill="#32E0C4"><animate attributeName="height" values="10;44;10" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="60;26;60" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="40" width="16" rx="2" fill="#B48CFF"><animate attributeName="height" values="30;16;30" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="40;54;40" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="64" width="16" rx="2" fill="#32E0C4"><animate attributeName="height" values="20;52;20" dur="3s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="y" values="50;18;50" dur="3s" begin="0.5s" repeatCount="indefinite"/></rect>
      <rect x="88" width="16" rx="2" fill="#B48CFF"><animate attributeName="height" values="36;24;36" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="y" values="34;46;34" dur="3s" begin="1s" repeatCount="indefinite"/></rect>
    </g>
  </g>

  <!-- Line chart panel -->
  <g transform="translate(700,30)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,6;0,0" dur="4.5s" repeatCount="indefinite"/>
      <rect width="160" height="92" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#B48CFF" stroke-opacity="0.5"/>
      <polyline points="12,74 42,54 72,62 104,32 146,18" fill="none" stroke="#32E0C4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="200" filter="url(#glow)">
        <animate attributeName="stroke-dashoffset" values="200;0;0;200" keyTimes="0;0.45;0.9;1" dur="5s" repeatCount="indefinite"/>
      </polyline>
      <circle cx="146" cy="18" r="5" fill="#FFFFFF" filter="url(#glow)"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="5s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Mini neural network panel -->
  <g transform="translate(735,140)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="5s" repeatCount="indefinite"/>
      <rect width="130" height="72" rx="10" fill="#FFFFFF" fill-opacity="0.06" stroke="#32E0C4" stroke-opacity="0.45"/>
      <g stroke="#32E0C4" stroke-opacity="0.4" stroke-width="1">
        <path d="M24 18 L65 14 M24 18 L65 36 M24 18 L65 58 M24 54 L65 14 M24 54 L65 36 M24 54 L65 58 M65 14 L106 28 M65 36 L106 28 M65 58 L106 28 M65 14 L106 46 M65 36 L106 46 M65 58 L106 46"/>
      </g>
      <g fill="#32E0C4" filter="url(#glow)">
        <circle cx="24" cy="18" r="5"><animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/></circle>
        <circle cx="24" cy="54" r="5"><animate attributeName="r" values="4;6;4" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
        <circle cx="65" cy="14" r="5" fill="#B48CFF"><animate attributeName="r" values="4;6;4" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
        <circle cx="65" cy="36" r="5" fill="#B48CFF"><animate attributeName="r" values="4;6;4" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle cx="65" cy="58" r="5" fill="#B48CFF"><animate attributeName="r" values="4;6;4" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="106" cy="28" r="5" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/></circle>
        <circle cx="106" cy="46" r="5" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
      </g>
    </g>
  </g>

  <!-- ═════════ ENGINEER AT HER DESK ═════════ -->
  <!-- desk -->
  <rect x="470" y="236" width="250" height="12" rx="6" fill="#1B3340"/>
  <rect x="490" y="248" width="8" height="40" fill="#1B3340"/>
  <rect x="692" y="248" width="8" height="40" fill="#1B3340"/>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-2;0,0" dur="3s" repeatCount="indefinite"/>
    <!-- long hair back -->
    <path d="M568 142 C560 100 640 100 632 142 L640 205 C620 215 580 215 560 205 Z" fill="#2B1B17"/>
    <!-- body / blazer -->
    <path d="M552 238 C552 198 568 186 595 184 L605 184 C632 186 648 198 648 238 Z" fill="#7F5FD6"/>
    <path d="M588 184 L600 214 L612 184 Z" fill="#FFFFFF"/>
    <!-- neck -->
    <rect x="592" y="168" width="16" height="18" rx="6" fill="#E8B796"/>
    <!-- head -->
    <ellipse cx="600" cy="146" rx="25" ry="29" fill="#F2C6A5"/>
    <!-- hair fringe -->
    <path d="M574 144 C574 112 626 110 626 144 C616 128 596 124 574 144 Z" fill="#2B1B17"/>
    <!-- bun -->
    <circle cx="600" cy="106" r="13" fill="#2B1B17"/>
    <!-- glasses -->
    <g fill="none" stroke="#32E0C4" stroke-width="1.8">
      <circle cx="589" cy="148" r="7.5"/><circle cx="611" cy="148" r="7.5"/><path d="M596.5 148 L603.5 148"/>
    </g>
    <!-- eyes (blink) -->
    <g fill="#2B1B17">
      <ellipse cx="589" cy="148" rx="2" ry="2.4"><animate attributeName="ry" values="2.4;2.4;0.3;2.4" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="611" cy="148" rx="2" ry="2.4"><animate attributeName="ry" values="2.4;2.4;0.3;2.4" keyTimes="0;0.9;0.95;1" dur="4s" repeatCount="indefinite"/></ellipse>
    </g>
    <!-- smile -->
    <path d="M592 162 Q600 169 608 162" fill="none" stroke="#B5524A" stroke-width="2" stroke-linecap="round"/>
    <!-- earrings -->
    <circle cx="575" cy="158" r="2.2" fill="#32E0C4"/><circle cx="625" cy="158" r="2.2" fill="#32E0C4"/>
  </g>

  <!-- laptop (back view) -->
  <rect x="546" y="206" width="108" height="32" rx="5" fill="#2A3F4A" stroke="#32E0C4" stroke-opacity="0.5"/>
  <circle cx="600" cy="222" r="6" fill="#32E0C4" filter="url(#glow)"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
  <rect x="536" y="236" width="128" height="4" rx="2" fill="#3A5564"/>

  <!-- hands typing -->
  <g fill="#F2C6A5">
    <ellipse cx="572" cy="238" rx="9" ry="5"><animate attributeName="cy" values="238;235;238" dur="0.5s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="628" cy="238" rx="9" ry="5"><animate attributeName="cy" values="235;238;235" dur="0.5s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- coffee cup + steam -->
  <rect x="680" y="216" width="22" height="20" rx="4" fill="#E8EEF2"/>
  <path d="M702 222 q10 0 10 8 q0 8 -10 8" fill="none" stroke="#E8EEF2" stroke-width="3"/>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round">
    <path d="M686 210 q-4 -6 0 -12 q4 -6 0 -12"><animate attributeName="opacity" values="0;0.8;0" dur="2.4s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-8" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M696 210 q-4 -6 0 -12 q4 -6 0 -12"><animate attributeName="opacity" values="0;0.8;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0;0,-8" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></path>
  </g>
</svg>
