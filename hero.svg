<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" role="img" aria-label="Ilef BEN HASSEN - Data Science and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.5" stop-color="#203A43"/>
      <stop offset="1" stop-color="#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#32E0C4"/>
      <stop offset="1" stop-color="#7F77DD"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="260" rx="18" fill="url(#bg)"/>

  <!-- Neural network: connections -->
  <g stroke="#32E0C4" stroke-opacity="0.25" stroke-width="1.2" fill="none">
    <path d="M640 60 L720 40 M640 60 L720 110 M640 60 L720 180"/>
    <path d="M640 130 L720 40 M640 130 L720 110 M640 130 L720 180"/>
    <path d="M640 200 L720 40 M640 200 L720 110 M640 200 L720 180"/>
    <path d="M720 40 L810 80 M720 40 L810 160 M720 110 L810 80 M720 110 L810 160 M720 180 L810 80 M720 180 L810 160"/>
    <path d="M640 60 L720 110 L810 160" stroke="#32E0C4" stroke-opacity="0.9" stroke-width="2.2" stroke-dasharray="14 200" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="214" to="0" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M640 200 L720 40 L810 80" stroke="#7F77DD" stroke-opacity="0.9" stroke-width="2.2" stroke-dasharray="14 200" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="214" to="0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Neural network: nodes -->
  <g fill="#32E0C4" filter="url(#glow)">
    <circle cx="640" cy="60" r="7"><animate attributeName="r" values="6;9;6" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="130" r="7"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="200" r="7"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="40" r="7" fill="#7F77DD"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="110" r="7" fill="#7F77DD"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="180" r="7" fill="#7F77DD"><animate attributeName="r" values="6;9;6" dur="2.4s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="80" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="160" r="8" fill="#FFFFFF"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Name -->
  <text x="48" y="92" font-family="'Fira Code', 'Courier New', monospace" font-size="42" font-weight="700" fill="url(#accent)">
    Ilef BEN HASSEN
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>

  <rect x="48" y="104" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" from="0" to="330" dur="1.4s" fill="freeze"/>
  </rect>

  <!-- Rotating roles -->
  <g font-family="'Fira Code', 'Courier New', monospace" font-size="20" fill="#FFFFFF">
    <text x="48" y="150" opacity="0">&gt; Data Science &amp; AI Engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.22;0.25;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="150" opacity="0">&gt; Full-Stack · FastAPI · React
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.30;0.47;0.50;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="150" opacity="0">&gt; MLOps · Docker · Cloud
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.55;0.72;0.75;1" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="48" y="150" opacity="0">&gt; RAG &amp; Cybersecurity AI
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.80;0.97;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Blinking cursor -->
  <rect x="48" y="170" width="12" height="22" fill="#32E0C4">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="48" y="232" font-family="'Fira Code', 'Courier New', monospace" font-size="14" fill="#9FB4C0">
    TEK-UP University · Tunisia · Open to Work
  </text>
</svg>
